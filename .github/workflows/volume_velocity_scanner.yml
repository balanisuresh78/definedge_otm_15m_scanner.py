name: High-Beta Volume & Velocity Continuous Scanner

on:
  workflow_dispatch:
  schedule:
    # Single continuous daily run starting at 09:15 AM IST (03:45 UTC) Mon-Fri
    - cron: '45 3 * * 1-5'

concurrency:
  group: volume-velocity-scanner
  cancel-in-progress: true

jobs:
  run-volume-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Maximum 6-hour single-runner window (no mid-day restart or memory wipe)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pytz pyotp tabulate

      - name: Run Continuous Volume & Velocity Scanner
        env:
          PYTHONUNBUFFERED: "1"
          DEFINEDGE_API_TOKEN: ${{ secrets.DEFINEDGE_API_TOKEN }}
          DEFINEDGE_API_SECRET: ${{ secrets.DEFINEDGE_API_SECRET }}
          DEFINEDGE_TOTP_SECRET: ${{ secrets.DEFINEDGE_TOTP_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          python -u volume_velocity_scanner.py
