name: High-Beta Volume & Velocity Continuous Scanner

on:
  workflow_dispatch:
  schedule:
    # Starts at 09:12 AM IST (03:42 UTC) and backup restart at 12:30 PM IST (07:00 UTC) Mon-Fri
    - cron: '42 3 * * 1-5'
    - cron: '0 7 * * 1-5'

# Automatically cancels any previous or stuck run when a new run starts
concurrency:
  group: volume-velocity-scanner
  cancel-in-progress: true

jobs:
  run-volume-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # Hard safety stop so a runner can never get stuck indefinitely

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pytz pyotp tabulate

      - name: Restore Today's Alert Memory Cache
        uses: actions/cache@v4
        with:
          path: volume_alert_memory.json
          key: vol-alert-mem-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vol-alert-mem-${{ runner.os }}-

      - name: Run Continuous Volume & Velocity Scanner
        env:
          PYTHONUNBUFFERED: "1"
          DEFINEDGE_API_TOKEN: ${{ secrets.DEFINEDGE_API_TOKEN }}
          DEFINEDGE_API_SECRET: ${{ secrets.DEFINEDGE_API_SECRET }}
          DEFINEDGE_TOTP_SECRET: ${{ secrets.DEFINEDGE_TOTP_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          python -u volume_velocity_scanner.py
