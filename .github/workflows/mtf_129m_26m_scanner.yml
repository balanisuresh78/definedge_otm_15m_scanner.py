name: 129m Supertrend -> 26m Breakout Scanner (228 F&O)

on:
  schedule:
    # Morning Session: 09:02 AM IST (03:32 UTC) — off-peak minute, safely after 09:00 IST window
    - cron: '32 3 * * 1-5'
    # Afternoon Session: 12:42 PM IST (07:12 UTC) — queues behind Morning until 12:45 IST handoff
    - cron: '12 7 * * 1-5'
  workflow_dispatch:
    inputs:
      session_mode:
        description: 'Session mode for manual run'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - MORNING
          - AFTERNOON

concurrency:
  group: mtf-129m-26m-st-scanner
  cancel-in-progress: false

jobs:
  scan-129m-26m-st:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore mtf_129m_26m_st_memory.json from Cache
        uses: actions/cache/restore@v4
        with:
          path: mtf_129m_26m_st_memory.json
          key: mtf-129m-26m-mem-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mtf-129m-26m-mem-${{ runner.os }}-

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyotp pytz tabulate

      - name: Run 129m ST -> 26m Breakout Scanner
        env:
          TZ: Asia/Kolkata
          DEFINEDGE_API_TOKEN: ${{ secrets.DEFINEDGE_API_TOKEN }}
          DEFINEDGE_API_SECRET: ${{ secrets.DEFINEDGE_API_SECRET }}
          DEFINEDGE_TOTP_SECRET: ${{ secrets.DEFINEDGE_TOTP_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export SESSION_MODE="${{ inputs.session_mode }}"
          elif [ "${{ github.event.schedule }}" = "32 3 * * 1-5" ]; then
            export SESSION_MODE="MORNING"
          else
            export SESSION_MODE="AFTERNOON"
          fi
          echo "Resolved SESSION_MODE=$SESSION_MODE"
          python definedge_129m_26m_st_scanner.py

      - name: Save mtf_129m_26m_st_memory.json to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mtf_129m_26m_st_memory.json
          key: mtf-129m-26m-mem-${{ runner.os }}-${{ github.run_id }}
